services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: crud_user
      POSTGRES_PASSWORD: crud_pass
      POSTGRES_DB: crud_db
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432" # host 5433 -> container 5432 (avoids colliding with local postgres)

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6380:6379" # host 6380 -> container 6379
    volumes:
      - redis_data:/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.17
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "9201:9200" # host 9201 -> container 9200 (avoids colliding with local ES)

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - elasticsearch
    environment:
      DATABASE_URL: postgresql://crud_user:crud_pass@postgres:5432/crud_db
      REDIS_URL: redis://redis:6379/0
      DATABASE_HOSTNAME: postgres
      DATABASE_PORT: "5432"
      DATABASE_PASSWORD: crud_pass
      DATABASE_NAME: crud_db
      DATABASE_USERNAME: crud_user
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: "9200"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      - ./:/app:delegated
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8001:8000" # host 8001 -> container 8000 (use 8001 to avoid collisions with local uvicorn)

  nginx:
    image: nginx:stable
    restart: unless-stopped
    depends_on:
      - web
      - react
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80" # host 8080 -> nginx 80

  react:
    build:
      context: ./react
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "http://localhost:8001"
    restart: unless-stopped
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=http://localhost:8001
    ports:
      - "3001:80" # host 3001 -> static nginx on container port 80

volumes:
  db_data:
  redis_data:
  esdata:

networks:
  default:
    name: crud_default

